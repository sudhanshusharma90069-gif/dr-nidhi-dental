name: Gemini Workflow
on: [push, pull_request]
jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run Gemini CLI
      uses: google-github-actions/run-gemini-cli@v1
      with:
        gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        gemini: "Review this pull request"
